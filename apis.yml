aid: dolarapp
name: DolarApp
description: 'DolarApp — rebranded to ARQ in March 2026 — is a Latin American cross-border
  fintech founded in Mexico in 2022 by former Revolut operators Fernando Terres, Zach
  Garman and Alvaro Correa. It gives consumers and businesses in Mexico, Argentina,
  Colombia and Brazil digital dollar (USDc) and euro (EURc) accounts, US ACH/wire receiving
  details, international cards accepted in 180+ countries, interbank-rate FX conversion,
  bulk supplier and contractor payouts, corporate cards with spend controls, and investment
  and credit products. It reports roughly two million users and is backed by Sequoia
  Capital, Founders Fund, Brevan Howard Digital, Y Combinator and Kaszek. DolarApp/ARQ
  runs a private API host at api.dolarapp.com for its own mobile and web applications
  but publishes no public developer program, documentation or machine-readable specification.'
