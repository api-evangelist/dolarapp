apis:
- name: DolarApp Status API
  description: 'Public, unauthenticated Atlassian Statuspage v2 JSON API served on DolarApp''s
    own status host. Exposes overall status, the ten monitored components (sign up,
    sign in, website, and card payments / bank transfers per country for AR, MX, CO
    and US), open incidents and scheduled maintenances. This is the only machine-readable
    HTTP surface DolarApp/ARQ publishes anonymously; it is vendor-provided rather than
    a first-party developer API.'
